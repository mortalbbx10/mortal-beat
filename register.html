<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - BeatMarket</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Additional styles for registration page */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 50px;
            background: linear-gradient(135deg, #6c44fc 0%, #ff7b54 100%);
        }
        
        .auth-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }
        
        .auth-header {
            background-color: var(--dark-color);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .auth-header p {
            opacity: 0.8;
        }
        
        .auth-body {
            padding: 40px 30px;
        }
        
        .auth-form .form-group {
            margin-bottom: 25px;
        }
        
        .auth-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .auth-form .input-group {
            position: relative;
        }
        
        .auth-form .input-group i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: var(--gray-color);
        }
        
        .auth-form input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: var(--transition);
        }
        
        .auth-form input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(108, 68, 252, 0.2);
        }
        
        .auth-form .submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            margin-top: 10px;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .account-type {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .account-option {
            flex: 1;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .account-option.active {
            border-color: var(--primary-color);
            background-color: rgba(108, 68, 252, 0.05);
        }
        
        .account-option i {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }
        
        .account-option h3 {
            margin-bottom: 10px;
        }
        
        .account-option p {
            font-size: 0.9rem;
            color: var(--gray-color);
        }
        
        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .terms-checkbox input {
            width: auto;
            margin-top: 5px;
        }
        
        .terms-checkbox label {
            font-weight: normal;
            font-size: 0.9rem;
        }
        
        .terms-checkbox a {
            color: var(--primary-color);
        }
        
        .auth-divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
        }
        
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #ddd;
        }
        
        .auth-divider span {
            padding: 0 15px;
            color: var(--gray-color);
            font-size: 0.9rem;
        }
        
        .social-login {
            display: flex;
            gap: 15px;
        }
        
        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .google-btn {
            background-color: white;
            color: #333;
            border: 1px solid #ddd;
        }
        
        .google-btn:hover {
            background-color: #f5f5f5;
        }
        
        .facebook-btn {
            background-color: #3b5998;
            color: white;
            border: none;
        }
        
        .facebook-btn:hover {
            background-color: #344e86;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9rem;
        }
        
        .auth-footer a {
            color: var(--primary-color);
            font-weight: 600;
            transition: var(--transition);
        }
        
        .auth-footer a:hover {
            opacity: 0.8;
        }
        
        @media (max-width: 576px) {
            .auth-header h1 {
                font-size: 1.8rem;
            }
            
            .auth-body {
                padding: 30px 20px;
            }
            
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            
            .account-type {
                flex-direction: column;
            }
            
            .social-login {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="index.html">BeatMarket</a>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="beats.html">Browse Beats</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-outline">Login</a>
                <a href="register.html" class="btn btn-primary active">Sign Up</a>
                <a href="cart.html" class="cart-icon"><i class="fas fa-shopping-cart"></i> <span class="cart-count">0</span></a>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <section class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Create Your Account</h1>
                <p>Join the BeatMarket community today</p>
            </div>
            <div class="auth-body">
                <div class="account-type">
                    <div class="account-option active" data-type="artist">
                        <i class="fas fa-headphones"></i>
                        <h3>Artist</h3>
                        <p>I want to purchase beats</p>
                    </div>
                    <div class="account-option" data-type="producer">
                        <i class="fas fa-music"></i>
                        <h3>Producer</h3>
                        <p>I want to sell my beats</p>
                    </div>
                </div>
                
                <form class="auth-form" id="register-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="first-name">First Name</label>
                            <div class="input-group">
                                <i class="fas fa-user"></i>
                                <input type="text" id="first-name" placeholder="Enter first name" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="last-name">Last Name</label>
                            <div class="input-group">
                                <i class="fas fa-user"></i>
                                <input type="text" id="last-name" placeholder="Enter last name" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" placeholder="Enter your email" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="input-group">
                            <i class="fas fa-at"></i>
                            <input type="text" id="username" placeholder="Choose a username" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="Create a password" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                        </div>
                    </div>
                    
                    <div class="terms-checkbox">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a></label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary submit-btn">Create Account</button>
                </form>
                
                <div class="auth-divider">
                    <span>OR</span>
                </div>
                
                <div class="social-login">
                    <button class="social-btn google-btn">
                        <i class="fab fa-google"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn facebook-btn">
                        <i class="fab fa-facebook-f"></i>
                        <span>Facebook</span>
                    </button>
                </div>
                
                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Log In</a></p>
                </div>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('register-form');
            const accountOptions = document.querySelectorAll('.account-option');
            const socialButtons = document.querySelectorAll('.social-btn');
            
            // Account type selection
            accountOptions.forEach(option => {
                option.addEventListener('click', function() {
                    // Remove active class from all options
                    accountOptions.forEach(opt => opt.classList.remove('active'));
                    
                    // Add active class to clicked option
                    this.classList.add('active');
                });
            });
            
            // Registration form submission
            if (registerForm) {
                registerForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const firstName = document.getElementById('first-name').value;
                    const lastName = document.getElementById('last-name').value;
                    const email = document.getElementById('email').value;
                    const username = document.getElementById('username').value;
                    const password = document.getElementById('password').value;
                    const confirmPassword = document.getElementById('confirm-password').value;
                    const accountType = document.querySelector('.account-option.active').getAttribute('data-type');
                    
                    // Basic validation
                    if (password !== confirmPassword) {
                        showNotification('Passwords do not match', 'error');
                        return;
                    }
                    
                    // In a real application, this would send the registration data to the server
                    // For demo purposes, we'll just simulate a successful registration
                    
                    // Show loading state
                    const submitBtn = this.querySelector('.submit-btn');
                    const originalText = submitBtn.textContent;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
                    submitBtn.disabled = true;
                    
                    // Simulate API call delay
                    setTimeout(() => {
                        // Reset button
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                        
                        // Show success notification
                        showNotification('Account created successfully! Redirecting...', 'success');
                        
                        // Redirect to home page after a short delay
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    }, 2000);
                });
            }
            
            // Social login buttons
            socialButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const provider = this.classList.contains('google-btn') ? 'Google' : 'Facebook';
                    
                    // Show loading state
                    const originalText = this.innerHTML;
                    this.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Connecting...`;
                    this.disabled = true;
                    
                    // Simulate API call delay
                    setTimeout(() => {
                        // Reset button
                        this.innerHTML = originalText;
                        this.disabled = false;
                        
                        // Show notification
                        showNotification(`${provider} signup is not available in demo mode`, 'info');
                    }, 2000);
                });
            });
            
            // Password validation
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirm-password');
            
            if (confirmPasswordInput) {
                confirmPasswordInput.addEventListener('input', function() {
                    if (this.value && passwordInput.value && this.value !== passwordInput.value) {
                        this.style.borderColor = '#dc3545';
                    } else if (this.value && passwordInput.value && this.value === passwordInput.value) {
                        this.style.borderColor = '#28a745';
                    } else {
                        this.style.borderColor = '#ddd';
                    }
                });
            }
            
            // Notification function (copied from main.js for this page)
            function showNotification(message, type = 'success') {
                // Create notification element
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                notification.innerHTML = `
                    <div class="notification-content">
                        <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'info' ? 'fa-info-circle' : 'fa-exclamation-circle'}"></i>
                        <p>${message}</p>
                    </div>
                `;
                
                // Add notification to DOM
                document.body.appendChild(notification);
                
                // Add active class after a small delay (for animation)
                setTimeout(() => {
                    notification.classList.add('active');
                }, 10);
                
                // Remove notification after 3 seconds
                setTimeout(() => {
                    notification.classList.remove('active');
                    setTimeout(() => {
                        notification.remove();
                    }, 300);
                }, 3000);
            }
            
            // Add CSS for notifications
            const style = document.createElement('style');
            style.textContent = `
                .notification {
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background-color: white;
                    border-radius: 5px;
                    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
                    padding: 15px 20px;
                    z-index: 1000;
                    transform: translateX(120%);
                    transition: transform 0.3s ease;
                }
                
                .notification.active {
                    transform: translateX(0);
                }
                
                .notification-content {
                    display: flex;
                    align-items: center;
                }
                
                .notification i {
                    margin-right: 10px;
                    font-size: 1.2rem;
                }
                
                .notification.success i {
                    color: #28a745;
                }
                
                .notification.info i {
                    color: #17a2b8;
                }
                
                .notification.error i {
                    color: #dc3545;
                }
            `;
            
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
